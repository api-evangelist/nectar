name: Nectar
description: Nectar (Nectar Life Sciences) is a hybrid, vertically-integrated allergy
  care platform combining at-home testing with in-person clinical care. Patients can
  self-test for dozens of indoor and outdoor environmental allergens using mail-in
  home kits, then receive personalized treatment including sublingual immunotherapy
  (allergy drops), prescription nasal sprays, rescue inhalers, and allergy shots.
  Its flagship Nectar Allergy Center in New York City treats adults and children for
  environmental allergies, asthma, food allergies, and eczema, alongside virtual
  telehealth appointments. Nectar is a consumer healthcare provider with no public
  developer API surface; it was backed by Obvious Ventures, Juxtapose, and Harmony
  Partners.
